name: Browser tests

# The full Playwright suite (about 11 minutes locally), run every night and on demand in four browsers:
# Chromium, Firefox, WebKit (the engine Safari uses) and WebKit on an iPhone-sized screen (mobile Safari).
# Each browser is its own job, so one failing browser does not hide the others. WebKit and mobile Safari are slower
# (about 5 times Chromium, and each failing test waits out a 30 second timeout), so WebKit is split into four parallel
# parts ("shards"); one unsplit job ran past its time limit. Playwright splits by test file. Mobile Safari runs only the
# phone-sized tests (see playwright.config.ts), so it is one job.
# It is kept out of the per-push CI (ci.yml) so a push gets its answer in about two minutes.
# To run it now: GitHub > Actions > "Browser tests" > Run workflow.
on:
  schedule:
    - cron: "23 7 * * *" # 07:23 UTC every day, in the small hours in the US
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e
  cancel-in-progress: false

jobs:
  e2e:
    name: Playwright (${{ matrix.browser }} ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { browser: chromium, shard: "1/1" }
          - { browser: firefox, shard: "1/1" }
          - { browser: webkit, shard: "1/4" }
          - { browser: webkit, shard: "2/4" }
          - { browser: webkit, shard: "3/4" }
          - { browser: webkit, shard: "4/4" }
          - { browser: ios-safari, shard: "1/1" }
    env:
      E2E_BROWSERS: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Install the browser
        run: npx playwright install --with-deps ${{ matrix.browser == 'ios-safari' && 'webkit' || matrix.browser }}

      # Traces go outside the project folder: files written inside it make the dev server reload pages in a loop.
      - name: Run the browser tests
        run: npx playwright test --output="$RUNNER_TEMP/pw-out" --shard=${{ matrix.shard }}

      - name: Keep traces of failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.browser }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/pw-out
          retention-days: 7
          if-no-files-found: ignore
