name: CI

# Runs the same checks you would run by hand: typecheck, lint, unit tests and a production build.
# The build matters on its own: typecheck and tests can pass while `next build` still fails.
# The browser tests (`npm run test:e2e`, about 11 minutes) are not run here.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push cancels the run for an older one on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck, lint and unit tests
        run: npm run check

      - name: Production build
        run: npm run build

  # Applies every migration to a throwaway PostgreSQL 16 and runs the access-policy tests (npm run test:db).
  # supabase/tests/run.sh only prints PASS/FAIL lines and exits 0 either way, so this job fails on any FAIL or ERROR line,
  # or if the run printed no PASS lines at all.
  # Pinned to ubuntu-24.04: it ships PostgreSQL 16 (what supabase/tests/run.sh expects). `ubuntu-latest` moved to a release
  # that has no postgresql-16 package, so the install step failed before any test ran.
  database:
    name: Database policy tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Make sure PostgreSQL 16 is installed
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/initdb ]; then
            sudo apt-get update
            sudo apt-get install -y postgresql-16
          fi

      - name: Run the database tests
        run: |
          bash supabase/tests/run.sh | tee "$RUNNER_TEMP/db-tests.log"
          if grep -Eq "FAIL|ERROR" "$RUNNER_TEMP/db-tests.log"; then echo "A database test failed"; exit 1; fi
          grep -q "PASS" "$RUNNER_TEMP/db-tests.log" || { echo "No tests ran"; exit 1; }
